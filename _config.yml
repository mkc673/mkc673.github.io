title:              Matt's Blog
description:        Personal blog and notes
author:             Matt
baseurl:            ""
url:                "https://mkc673.github.io"

# Add your google-analytics ID here to activate google analytics
google_analytics:   ""

# Build settings
markdown:           kramdown
remote_theme:       StartBootstrap/startbootstrap-clean-blog-jekyll
paginate:           5
paginate_path:      "/posts/page:num/"
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
